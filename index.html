<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>VxC Clean Bot (Browser)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
  .box{width:100%;max-width:520px;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{text-align:center;font-size:24px;background:linear-gradient(90deg,#5865F2,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .sub{text-align:center;color:#aaa;font-size:12px;margin-bottom:20px}
  label{display:block;font-size:13px;color:#ccc;margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-size:14px;outline:none;margin-bottom:14px}
  input:focus{border-color:#5865F2;box-shadow:0 0 0 3px rgba(88,101,242,.2)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:10px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08)}
  .row span{font-size:14px;font-weight:600}
  .switch{position:relative;width:52px;height:28px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#444;border-radius:30px;cursor:pointer;transition:.3s}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
  input:checked+.slider{background:linear-gradient(90deg,#22c55e,#16a34a)}
  input:checked+.slider:before{transform:translateX(24px)}
  .status{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
  .status.on{color:#22c55e;border-color:rgba(34,197,94,.4)}
  .status.off{color:#ef4444;border-color:rgba(239,68,68,.4)}
  .status.info{color:#facc15;border-color:rgba(250,204,21,.4)}
  .log{margin-top:14px;max-height:140px;overflow-y:auto;font-size:12px;font-family:monospace;color:#9ca3af;background:rgba(0,0,0,.4);padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.06)}
  .log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .hint{font-size:11px;color:#888;margin-top:10px;line-height:1.6}
  .hint code{background:rgba(88,101,242,.15);color:#a5b4fc;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="box">
  <h1>🤖 VxC Clean Bot</h1>
  <p class="sub">Chạy trực tiếp trong trình duyệt – không cần server</p>

  <label>Bot Token</label>
  <input type="password" id="token" placeholder="Nhập token bot Discord..." autocomplete="off">

  <div class="row">
    <span>Trạng thái bot</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status off" id="status">Bot đang tắt</div>

  <p class="hint">
    Lệnh: <code>/vxcclean user:@abc history:1mins</code><br>
    → Xoá toàn bộ tin nhắn của user trong khoảng thời gian gần nhất. Chỉ owner server dùng được.<br>
    ⚠️ Phải giữ tab web mở thì bot mới hoạt động.
  </p>

  <div class="log" id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const tokenEl = $('token');
const toggleEl = $('toggle');
const statusEl = $('status');
const logEl = $('log');

let worker = null;

function log(msg){
  const t = new Date().toLocaleTimeString();
  const d = document.createElement('div');
  d.textContent = `[${t}] ${msg}`;
  logEl.prepend(d);
  if(logEl.children.length > 60) logEl.lastChild.remove();
}
function setStatus(cls, txt){
  statusEl.className = 'status ' + cls;
  statusEl.textContent = txt;
}

// Load token đã lưu
window.addEventListener('load', () => {
  const t = localStorage.getItem('vxc_tok');
  if(t) tokenEl.value = t;
  log('UI sẵn sàng.');
});

toggleEl.addEventListener('change', () => {
  const on = toggleEl.checked;
  const token = tokenEl.value.trim();

  if(on){
    if(!token){ alert('Nhập token trước!'); toggleEl.checked = false; return; }
    localStorage.setItem('vxc_tok', token);

    // Khởi tạo Web Worker
    worker = new Worker('bot-worker.js');
    worker.onmessage = e => {
      const { type, data } = e.data;
      if(type === 'log') log(data);
      else if(type === 'status') setStatus(data.cls, data.txt);
    };
    worker.postMessage({ type: 'start', token });

    setStatus('info', '⏳ Đang kết nối Discord...');
    log('Đã gửi token tới worker.');
  } else {
    if(worker){ worker.postMessage({ type: 'stop' }); worker.terminate(); worker = null; }
    setStatus('off', '🔴 Bot đã tắt');
    log('Đã dừng worker.');
  }
});
</script>
</body>
  </html>
